# 此文件用于 bind mount 到原始 Nginx 容器的 /etc/nginx/nginx.conf。
# 所有 Lua 文件均来自只读挂载 /opt/nginx-lua，容器可写层中没有安装任何模块。
load_module /opt/nginx-lua/ndk_http_module.so;
load_module /opt/nginx-lua/ngx_http_lua_module.so;

worker_processes 1;
error_log /var/log/nginx/error.log error;
pid /run/nginx.pid;

events {
    worker_connections 128;
}

http {
    log_format main '$time_iso8601 - $remote_user | $remote_addr | '
                    '$status - "$request" - bytes=$body_bytes_sent | '
                    'server=$server_name | referer="$http_referer" | '
                    '$http_x_forwarded_for | ua="$http_user_agent" | '
                    '(rt: $request_time, urt: $upstream_response_time, uht: $upstream_header_time, up: $upstream_addr, us: $upstream_status) | '
                    '[via: $http_via, server: $http_server]';
    access_log /var/log/nginx/access.log main;

    lua_package_path "/opt/nginx-lua/luajit/lib/lua/5.1/?.lua;;";

    server {
        listen 8080;

        location = /lua {
            default_type text/plain;
            content_by_lua_block {
                local jit = require("jit")
                local core = require("resty.core")
                ngx.say("bind_mount_ok; ", jit.version,
                        "; ngx_lua=", ngx.config.ngx_lua_version,
                        "; resty_core=", core.version)
            }
        }
    }
}
